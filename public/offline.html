<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050B18" />
    <title>Offline — GolaçoCup</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(circle at 50% 0%, #0d1a30 0%, #050B18 60%);
        color: #e8eefc;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .card {
        max-width: 380px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      }
      .ball { font-size: 56px; margin-bottom: 12px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5)); }
      h1 { font-size: 22px; margin: 8px 0 6px; font-weight: 700; }
      p { font-size: 15px; color: #a8b3c7; line-height: 1.5; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: linear-gradient(135deg, #22c55e, #06b6d4);
        color: white; font-weight: 600; font-size: 15px;
        padding: 12px 22px; border-radius: 999px;
        box-shadow: 0 10px 30px rgba(34,197,94,0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ball">⚽</div>
      <h1>You're offline</h1>
      <p>GolaçoCup needs a connection to load this page. Your saved matches are still safe.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
